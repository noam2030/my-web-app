# GitHub Actions Labeler v5 configuration schema (kebab-case options)
UI:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**/*'
          - 'src/app/globals.css'
          - 'src/app/layout.tsx'

API:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/app/api/**/*'

Documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'AGENTS.md'
          - 'CLAUDE.md'
          - '.github/**/*'

Configuration:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'tsconfig.json'
          - 'next.config.ts'
          - 'Dockerfile'
